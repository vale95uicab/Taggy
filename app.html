<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TAGGY App | Dueños</title>
<meta name="theme-color" content="#FFF8ED">
<link rel="icon" href="taggy-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--cream:#FFF8ED;--orange:#EF8A27;--deep:#B85C14;--yellow:#F7C957;--sage:#86A79B;--blue:#9BC3CE;--coral:#D9826B;--black:#202020}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"DM Sans",sans-serif;color:var(--black);background:#f1e4cf;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 15%,#F7C957 0,transparent 28%),radial-gradient(circle at 90% 30%,#9BC3CE 0,transparent 26%),radial-gradient(circle at 40% 100%,#F3A18C 0,transparent 30%)}
h1,h2,h3,.b{font-family:"Baloo 2",sans-serif}
.app{max-width:430px;margin:auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:96px;box-shadow:0 0 70px rgba(0,0,0,.18);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:0;z-index:20;background:rgba(255,248,237,.9);backdrop-filter:blur(12px)}
.top img{height:38px}
.circ{width:42px;height:42px;border-radius:50%;border:0;background:var(--orange);font-size:1.1rem;cursor:pointer}
.screen{display:none;padding:6px 18px;animation:up .5s cubic-bezier(.2,.7,.2,1)}
.screen.on{display:block}
.screen>*{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.screen>*:nth-child(2){animation-delay:.07s}.screen>*:nth-child(3){animation-delay:.14s}.screen>*:nth-child(4){animation-delay:.21s}.screen>*:nth-child(5){animation-delay:.28s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.07)}
.tag{display:inline-block;background:var(--yellow);padding:6px 12px;border-radius:30px;font-size:.68rem;font-weight:800;letter-spacing:.04em}
.tag.lost{background:var(--coral);color:#fff;animation:blink 1s infinite}.tag.ok{background:var(--sage);color:#fff}
@keyframes blink{50%{transform:scale(1.07)}}
.chips{display:flex;justify-content:space-between;margin-bottom:12px}
.pet{display:flex;gap:16px;align-items:center}
.photo{width:92px;height:92px;border-radius:50%;background:linear-gradient(140deg,var(--blue),var(--sage));display:grid;place-items:center;font-size:2.6rem;overflow:hidden;flex:none;border:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.12);position:relative;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.pet h2{font-size:2.3rem;line-height:1}.pet small{opacity:.65;font-weight:600;display:block;margin:2px 0 8px}
.shield{display:flex;align-items:center;gap:12px;background:var(--blue);cursor:pointer;font-weight:800}
.shield i{font-style:normal;width:40px;height:40px;border-radius:14px;background:var(--cream);display:grid;place-items:center}
.shield span{margin-left:auto;font-size:.75rem}
.label{font-size:.72rem;font-weight:800;letter-spacing:.06em;opacity:.6;margin:18px 4px 10px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{background:#fff;border:0;border-radius:22px;padding:14px 6px;font:700 .72rem "DM Sans";cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.06);transition:.2s}
.act:active{transform:scale(.93)}.act i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--yellow);font-style:normal;font-size:1.2rem;margin:0 auto 8px}
.loc{display:flex;gap:16px;align-items:center;background:var(--yellow);transition:.4s}.loc.lost{background:var(--coral);color:#fff}
.loc p{font-size:.85rem;line-height:1.4;margin-top:3px}
.radar{width:104px;height:104px;flex:none;border-radius:50%;background:rgba(255,255,255,.5);position:relative;display:grid;place-items:center;overflow:hidden}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--orange);opacity:0;animation:ping 2.8s ease-out infinite}
.ring:nth-child(2){animation-delay:.9s}.ring:nth-child(3){animation-delay:1.8s}
@keyframes ping{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(239,138,39,.6),transparent 35%);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pin{position:relative;z-index:2;width:40px;height:40px;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:0 0 0 5px rgba(255,255,255,.75);animation:hop 1.4s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.loc.lost .ring{border-color:#fff;animation-duration:1.3s}.loc.lost .sweep{animation-duration:1.2s;background:conic-gradient(rgba(255,255,255,.8),transparent 35%)}.loc.lost .pin{background:var(--coral)}
.btn{width:100%;padding:15px;border-radius:30px;border:1.5px solid var(--black);font:800 1rem "DM Sans";cursor:pointer;margin-top:10px;transition:.2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}.btn.p{background:var(--orange);border-color:var(--orange)}.btn.w{background:#fff}
.btn.sos{background:#fff;border-color:var(--coral);color:var(--coral)}.btn.sos.found{background:var(--sage);border-color:var(--sage);color:#fff}
.nfcbox{text-align:center;background:linear-gradient(160deg,#fff,#FCE8CC)}
.nfc{width:150px;height:150px;border-radius:50%;border:0;margin:14px auto;display:grid;place-items:center;position:relative;background:var(--deep);color:#fff;font:800 1.2rem "Baloo 2";cursor:pointer;box-shadow:0 0 0 14px rgba(239,138,39,.25),0 0 0 30px rgba(239,138,39,.12);animation:breathe 3s ease-in-out infinite}
.nfc small{display:block;font:600 .65rem "DM Sans";opacity:.8}
.nfc.linking{animation:linking .5s ease-in-out 4}
@keyframes breathe{50%{transform:scale(1.06)}}@keyframes linking{50%{transform:scale(1.18);background:var(--orange)}}
.web{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.web a{background:#fff;border-radius:22px;padding:16px;font-weight:800;text-decoration:none;color:inherit;box-shadow:0 8px 20px rgba(0,0,0,.06);transition:.2s}
.web a:active{transform:scale(.95)}.web a:nth-child(1){background:var(--yellow)}.web a:nth-child(2){background:var(--blue)}.web a:nth-child(3){background:#F3C9BC}
.rec{border-radius:22px;padding:16px;margin-bottom:12px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.rec.alert{background:#FBE3DD;border-left:6px solid var(--coral)}
.rec small{font-weight:800;font-size:.68rem;letter-spacing:.04em;opacity:.7}.rec h3{font-size:1.25rem;margin:4px 0}.rec p{font-size:.85rem;line-height:1.5}
.seg{display:flex;background:#F4E8D4;border-radius:30px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px;border-radius:30px;font:800 .85rem "DM Sans";cursor:pointer;transition:.25s}.seg .on{background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.pane{display:none}.pane.on{display:block}
label{display:block;font-weight:700;font-size:.8rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:15px;border:1.5px solid rgba(32,32,32,.12);background:var(--cream);font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(239,138,39,.18)}
textarea{min-height:90px;resize:vertical}
.pick{display:flex;gap:8px}.pick button{flex:1;padding:12px;border:0;border-radius:14px;background:var(--cream);font:800 .85rem "DM Sans";cursor:pointer}.pick .on{background:var(--deep);color:#fff}
.sw{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:.85rem;font-weight:700}
.sw button{margin-left:auto;width:50px;height:28px;border-radius:20px;border:0;background:#ccc;position:relative;cursor:pointer;flex:none;transition:.3s}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s}.sw button.on{background:var(--deep)}.sw button.on::after{left:25px}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.traits span{background:#FCE8CC;padding:8px 12px;border-radius:20px;font-size:.8rem;font-weight:700}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-radius:28px 28px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.08);z-index:30}
.nav button{flex:1;border:0;background:none;font:800 .72rem "DM Sans";color:#999;cursor:pointer;padding:6px;transition:.25s}.nav i{display:block;font-style:normal;font-size:1.4rem;transition:.25s}
.nav .on{color:var(--deep)}.nav .on i{transform:translateY(-4px) scale(1.15)}
.sheetbg{position:fixed;inset:0;background:rgba(32,32,32,.5);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}.sheetbg.on{display:flex}
.sheet{width:min(430px,100%);background:var(--cream);border-radius:34px 34px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:sheet .4s cubic-bezier(.2,.9,.3,1);max-height:90vh;overflow:auto}
@keyframes sheet{from{transform:translateY(100%)}}
.sheet h3{font-size:1.6rem;margin:10px 0 4px}.row{display:flex;gap:10px}.row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,150px);background:var(--black);color:#fff;padding:14px 22px;border-radius:30px;font-weight:700;font-size:.9rem;z-index:99;transition:transform .5s cubic-bezier(.2,1.4,.4,1);max-width:88%;text-align:center}.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><img src="taggy-logo.png" alt="TAGGY"><button class="circ" onclick="go('profile')" aria-label="Perfil">👤</button></div>
  <main>
    <section class="screen on" id="home"></section>
    <section class="screen" id="health"></section>
    <section class="screen" id="profile"></section>
  </main>
  <nav class="nav">
    <button data-t="home" class="on"><i>🐾</i>Mascotas</button>
    <button data-t="health"><i>🩺</i>Salud</button>
    <button data-t="profile"><i>👤</i>Perfil</button>
  </nav>
</div>
<div class="sheetbg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
const $=s=>document.querySelector(s),K="taggyApp";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF={shield:true,lost:null,
 pet:{name:"Dember",species:"Perro",breed:"Shih Tzu",sex:"Macho",birth:"2025-05-14",neutered:true,photo:"",id:"#TG-9204-DEMBER",tags:["Amigable","Juguetón","Teme a pirotecnia","Sociable con perros"]},
 tutor:{name:"Valentina Palomino",phone:"(999) 123-4567",email:"vale.palo@gmail.com",coName:"Juanito Alcachofas",coPhone:"(999) 987-6543",city:"Mérida, Yucatán",zone:"Fracc. Los Héroes",hide:true},
 health:[{k:"alert",t:"Alergia severa a la penicilina",d:"2024-10-12",n:"Reacción anafiláctica previa reportada. No suministrar derivados de betalactámicos."},
         {k:"visit",t:"Visita y chequeo anual",d:"2024-10-12",n:"Hospital Veterinario del Norte"},
         {k:"vac",t:"Vacuna séxtuple canina (DHPPi)",d:"2024-10-12",n:"Dosis 2024-2025. Tolera sin reacciones adversas locales."}]};
let S;try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
S={...DEF,...S,pet:{...DEF.pet,...S.pet},tutor:{...DEF.tutor,...S.tutor}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast("No se pudo guardar (foto muy grande)")}};
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3000)}
const fdate=d=>new Date(d+"T12:00").toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});
function age(d){const b=new Date(d),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(m<12)return m+" meses";const y=Math.floor(m/12);return y+(y==1?" año":" años")}
function go(t){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==t));document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function sheet(h){$("#sheet").innerHTML=h;$("#bg").classList.add("on")}
const close=()=>$("#bg").classList.remove("on");
$("#bg").onclick=e=>{if(e.target.id=="bg")close()};
const photo=(p,big)=>`<div class="photo" onclick="$('#file').click()" title="Cambiar foto">${p.photo?`<img src="${p.photo}" alt="">`:"🐶"}</div>`;

function home(){const p=S.pet,l=S.lost;
$("#home").innerHTML=`
<div class="chips"><span class="tag">● MASCOTA ACTIVA</span><span class="tag">((•)) GPS ACTIVO</span></div>
<div class="card pet">${photo(p)}<div><h2>${esc(p.name)} <span style="color:var(--orange)">✔</span></h2><small>${esc(p.breed)} · ${age(p.birth)}</small>
 <span class="tag ${l?"lost":"ok"}">${l?"🚨 PERDIDO":"● EN CASA / SEGURO"}</span></div></div>
<div class="card shield" onclick="S.shield=!S.shield;save();home();toast(S.shield?'Escudo protector activado':'Escudo desactivado')"><i>🛡️</i>Escudo Protector TAGGY<span>${S.shield?"ACTIVO":"APAGADO"}</span></div>
<div class="label">ACCIONES RÁPIDAS</div>
<div class="acts"><button class="act" onclick="go('health');addRec()"><i>📝</i>Añadir registro</button><button class="act" onclick="nfcSheet()"><i>📲</i>Ficha collar NFC</button><button class="act" onclick="go('profile')"><i>✏️</i>Editar perfil</button></div>
<div class="label">LOCALIZADOR</div>
<div class="card loc ${l?"lost":""}"><div class="radar"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="sweep"></span><span class="pin">🐾</span></div>
 <div><strong class="b" style="font-size:1.25rem">${l?"¡Buscando a "+esc(p.name)+"!":"Zona segura"}</strong><p>${l?"Reportado en "+esc(l.zone)+". Tu reporte ya está en la página web.":"Última zona: "+esc(S.tutor.zone)+", "+esc(S.tutor.city)}</p></div></div>
<button class="btn sos ${l?"found":""}" onclick="${l?"found()":"lostSheet()"}">${l?"✓ ¡Ya lo encontré!":"🚨 Reportar perrito perdido"}</button>
<div class="card nfcbox" style="margin-top:16px"><span class="tag">COLLAR</span><button class="nfc" id="nfc" onclick="link()">TAGGY<small>NFC</small></button><small id="nfcT" style="font-weight:700;opacity:.7">Listo para enlazar con el dorso del celular</small></div>
<div class="label">SITIO WEB TAGGY</div>
<div class="web"><a href="comprar.html">🛒<br>Comprar collares</a><a href="foro.html">💬<br>Foro de la comunidad</a><a href="reportar.html">🔎<br>Mascotas perdidas</a><a href="index.html" style="background:#fff">🏠<br>Inicio TAGGY</a></div>`}

function link(){const n=$("#nfc");n.classList.add("linking");$("#nfcT").textContent="Enlazando…";setTimeout(()=>{n.classList.remove("linking");$("#nfcT").textContent="✓ Collar enlazado y sincronizado";toast("Collar sincronizado 🐾")},2100)}
function nfcSheet(){sheet(`<span class="tag">FICHA NFC</span><h3>${esc(S.pet.name)}</h3><p style="margin:6px 0 14px">ID TAGGY <strong>${esc(S.pet.id)}</strong><br>Quien escanee el collar verá su nombre, rasgos y el teléfono de contacto${S.tutor.hide?" (sin dirección exacta)":""}.</p><button class="btn p" onclick="close()">Listo</button>`)}
function lostSheet(){sheet(`<span class="tag lost">REPORTE</span><h3>¿Dónde lo viste por última vez?</h3><form onsubmit="sendLost(event)"><label>Zona</label><input id="lz" required value="${esc(S.tutor.zone)}"><label>Mensaje (opcional)</label><textarea id="lm" placeholder="Llevaba su collar TAGGY..."></textarea><div class="row"><button type="button" class="btn w" onclick="close()">Cancelar</button><button class="btn p">Enviar reporte</button></div></form>`)}
function sendLost(e){e.preventDefault();const p=S.pet,t=S.tutor,zone=$("#lz").value.trim(),m=$("#lm").value.trim();
 let r=[];try{r=JSON.parse(localStorage.getItem("taggyReports"))||[]}catch(x){}
 r.unshift({name:p.name,zone,description:`${p.breed}, ${p.sex.toLowerCase()}, ${age(p.birth)}. ${p.tags.join(", ")}. ${m}`,contact:t.phone});
 localStorage.setItem("taggyReports",JSON.stringify(r));S.lost={zone};save();close();home();toast("Reporte enviado a la página web 🚨")}
function found(){S.lost=null;save();home();toast("¡Qué alegría! "+S.pet.name+" ya está en casa 🏠")}

const ico={alert:["🚨","ALERTA MÉDICA CRÍTICA"],visit:["🩺","CONSULTA GENERAL"],vac:["💉","INMUNIZACIÓN"],other:["📋","REGISTRO"]};
function health(){$("#health").innerHTML=`<h2 style="font-size:2.2rem;margin:8px 0 2px">Historial de salud</h2><p style="opacity:.65;margin-bottom:14px">${esc(S.pet.name)} · ${S.health.length} registros</p>`+
 S.health.map((r,i)=>`<div class="rec ${r.k=="alert"?"alert":""}"><small>${ico[r.k][0]} ${ico[r.k][1]} · ${fdate(r.d)}</small><h3>${esc(r.t)}</h3><p>${esc(r.n)}</p><button onclick="S.health.splice(${i},1);save();health()" style="border:0;background:none;color:var(--coral);font-weight:800;margin-top:8px;cursor:pointer">Eliminar</button></div>`).join("")+
 `<button class="btn p" onclick="addRec()">+ Añadir registro</button>`}
function addRec(){sheet(`<span class="tag">NUEVO</span><h3>Añadir registro</h3><form onsubmit="saveRec(event)"><label>Tipo</label><select id="rk"><option value="vac">Vacuna</option><option value="visit">Consulta</option><option value="alert">Alerta médica</option><option value="other">Otro</option></select><label>Título</label><input id="rt" required><label>Fecha</label><input id="rd" type="date" required value="${new Date().toISOString().slice(0,10)}"><label>Notas</label><textarea id="rn"></textarea><div class="row"><button type="button" class="btn w" onclick="close()">Cancelar</button><button class="btn p">Guardar</button></div></form>`)}
function saveRec(e){e.preventDefault();S.health.unshift({k:$("#rk").value,t:$("#rt").value,d:$("#rd").value,n:$("#rn").value});save();close();health();toast("Registro añadido ✓")}

function profile(){const p=S.pet,t=S.tutor;
const sw=(id,v,txt)=>`<div class="sw">${txt}<button id="${id}" class="${v?"on":""}" onclick="this.classList.toggle('on')"></button></div>`;
const pk=(g,opts,v)=>`<div class="pick" data-g="${g}">${opts.map(o=>`<button type="button" class="${o==v?"on":""}" onclick="pickIt(this)">${o}</button>`).join("")}</div>`;
$("#profile").innerHTML=`<div class="seg"><button class="on" onclick="pane(0)">🐾 Datos mascota</button><button onclick="pane(1)">☎ Contacto tutor</button></div>
<div class="pane on"><div style="text-align:center;margin:10px 0">${photo(p).replace('class="photo"','class="photo" style="margin:auto;width:120px;height:120px"')}<p style="font-size:.8rem;margin-top:8px"><span class="tag">ID TAGGY · ${esc(p.id)}</span><br>Toca la foto para cambiarla</p></div>
<div class="card"><h3>Identidad básica</h3><label>Nombre o apodo</label><input id="pn" value="${esc(p.name)}"><label>Especie</label>${pk("sp",["Perro","Gato","Otro"],p.species)}<label>Raza</label><input id="pb" value="${esc(p.breed)}"><label>Sexo</label>${pk("sx",["Macho","Hembra"],p.sex)}<label>Fecha de nacimiento</label><input id="pd" type="date" value="${p.birth}">${sw("pne",p.neutered,"Esterilizado / castrado")}</div>
<div class="card"><h3>Carácter y auxilio rápido</h3><div class="traits" id="tr">${p.tags.map((x,i)=>`<span onclick="p_tag(${i})">${esc(x)} ✕</span>`).join("")}</div><label>Añadir rasgo</label><div class="row"><input id="nt" placeholder="Ej. Le gusta la pelota"><button type="button" class="btn p" style="width:90px;margin:0" onclick="addTag()">+</button></div></div></div>
<div class="pane"><div class="card"><h3>Datos del dueño y tutor</h3><label>Nombre completo</label><input id="tn" value="${esc(t.name)}"><label>Teléfono de llamada directa</label><input id="tp" type="tel" value="${esc(t.phone)}"><label>Correo de alertas</label><input id="te" type="email" value="${esc(t.email)}"><label>Co-tutor de respaldo</label><input id="tcn" value="${esc(t.coName)}"><input id="tcp" type="tel" style="margin-top:8px" value="${esc(t.coPhone)}"></div>
<div class="card"><h3>Domicilio y perímetro</h3><label>Ciudad / Estado</label><input id="tc" value="${esc(t.city)}"><label>Colonia / Zona</label><input id="tz" value="${esc(t.zone)}">${sw("th",t.hide,"Ocultar dirección exacta (solo se muestra colonia y zona)")}</div></div>
<button class="btn p" onclick="saveProf()">Guardar y sincronizar con collar</button>
<div class="label">SITIO WEB TAGGY</div><div class="web"><a href="comprar.html">🛒<br>Comprar</a><a href="foro.html">💬<br>Foro</a></div>`}
function pane(i){document.querySelectorAll("#profile .pane").forEach((e,j)=>e.classList.toggle("on",i==j));document.querySelectorAll("#profile .seg button").forEach((e,j)=>e.classList.toggle("on",i==j))}
function pickIt(b){b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}
const pv=g=>document.querySelector(`[data-g=${g}] .on`).textContent;
function p_tag(i){S.pet.tags.splice(i,1);save();profile()}
function addTag(){const v=$("#nt").value.trim();if(v){S.pet.tags.push(v);save();profile()}}
function saveProf(){const p=S.pet,t=S.tutor,v=id=>$("#"+id).value.trim(),b=id=>$("#"+id).classList.contains("on");
 Object.assign(p,{name:v("pn")||p.name,species:pv("sp"),breed:v("pb"),sex:pv("sx"),birth:v("pd")||p.birth,neutered:b("pne")});
 Object.assign(t,{name:v("tn"),phone:v("tp"),email:v("te"),coName:v("tcn"),coPhone:v("tcp"),city:v("tc"),zone:v("tz"),hide:b("th")});
 save();home();toast("Datos guardados y sincronizados con el collar ✓")}

$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,400/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.pet.photo=c.toDataURL("image/jpeg",.8);save();home();profile();toast("Foto actualizada 📷")};im.src=r.result};r.readAsDataURL(f)};
home();health();profile();
</script>
